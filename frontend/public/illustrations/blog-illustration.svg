<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pageGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8FAFC;stop-opacity:1" />
    </linearGradient>
    <filter id="pageShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#4F46E5" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background atmosphere -->
  <rect width="500" height="500" fill="url(#brandGradient)" opacity="0.02"/>

  <!-- Floating pages/articles -->
  <g filter="url(#pageShadow)">
    <!-- Back page -->
    <rect x="60" y="100" width="160" height="220" rx="8" fill="url(#pageGradient)" stroke="#E2E8F0" stroke-width="1" opacity="0.6">
      <animate attributeName="y" values="100;95;100" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="75" y="120" width="130" height="16" rx="3" fill="url(#brandGradient)" opacity="0.7"/>
    <g font-family="system-ui" font-size="10" fill="#64748B" opacity="0.6">
      <rect x="75" y="150" width="100" height="8" rx="2"/>
      <rect x="75" y="165" width="120" height="8" rx="2"/>
      <rect x="75" y="180" width="80" height="8" rx="2"/>
      <rect x="75" y="195" width="110" height="8" rx="2"/>
      <rect x="75" y="210" width="90" height="8" rx="2"/>
      <rect x="75" y="225" width="105" height="8" rx="2"/>
    </g>
    <!-- Category tag -->
    <rect x="75" y="260" width="50" height="18" rx="9" fill="url(#brandGradient)" opacity="0.2"/>
    <text x="100" y="273" text-anchor="middle" font-size="8" font-weight="600" fill="#4F46E5" font-family="system-ui">Article</text>

    <!-- Main center page -->
    <rect x="170" y="50" width="200" height="280" rx="12" fill="url(#pageGradient)" stroke="url(#brandGradient)" stroke-width="2" filter="url(#softGlow)">
      <animate attributeName="y" values="50;45;50" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- Header area -->
    <rect x="190" y="75" width="160" height="40" rx="6" fill="url(#brandGradient)" opacity="0.1"/>
    <text x="270" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="url(#brandGradient)" filter="url(#textGlow)"><tspan fill="#4F46E5">Expertise</tspan> <tspan fill="#06B6D4">Article</tspan></text>
    <!-- Meta -->
    <g font-size="9" font-family="system-ui" fill="#94A3B8">
      <text x="195" y="125">12 min read</text>
      <text x="320" y="125" text-anchor="end">Nov 2024</text>
    </g>
    <!-- Content lines -->
    <g font-family="system-ui" font-size="10" fill="#475569" opacity="0.7">
      <rect x="190" y="145" width="160" height="10" rx="2" fill="#E2E8F0"/>
      <rect x="190" y="162" width="145" height="10" rx="2" fill="#E2E8F0"/>
      <rect x="190" y="179" width="155" height="10" rx="2" fill="#E2E8F0"/>
      <rect x="190" y="196" width="130" height="10" rx="2" fill="#E2E8F0"/>
      <rect x="190" y="213" width="150" height="10" rx="2" fill="#E2E8F0"/>
      <rect x="190" y="230" width="110" height="10" rx="2" fill="#E2E8F0"/>
    </g>
    <!-- Code block -->
    <rect x="190" y="255" width="160" height="55" rx="6" fill="#0F172A" opacity="0.9"/>
    <g font-family="monospace" font-size="9" fill="#E2E8F0" opacity="0.8">
      <text x="200" y="270">const generate = async () =></text>
      <text x="210" y="282">{</text>
      <text x="218" y="294">return await AI.write();</text>
      <text x="210" y="306">}</text>
    </g>
    <!-- Tags -->
    <g font-size="8" font-weight="600" font-family="system-ui">
      <rect x="190" y="320" width="35" height="16" rx="4" fill="url(#brandGradient)" opacity="0.2"/>
      <text x="207.5" y="331" text-anchor="middle" fill="#4F46E5">React</text>
      <rect x="230" y="320" width="30" height="16" rx="4" fill="url(#brandGradient)" opacity="0.2"/>
      <text x="245" y="331" text-anchor="middle" fill="#06B6D4">AI</text>
      <rect x="270" y="320" width="35" height="16" rx="4" fill="url(#brandGradient)" opacity="0.2"/>
      <text x="287.5" y="331" text-anchor="middle" fill="#F59E0B">TypeScript</text>
    </g>

    <!-- Front page -->
    <rect x="370" y="130" width="140" height="200" rx="8" fill="url(#pageGradient)" stroke="#E2E8F0" stroke-width="1" opacity="0.7">
      <animate attributeName="y" values="130;125;130" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="385" y="150" width="110" height="14" rx="3" fill="url(#brandGradient)" opacity="0.7"/>
    <g font-family="system-ui" font-size="9" fill="#64748B" opacity="0.5">
      <rect x="385" y="175" width="80" height="7" rx="2"/>
      <rect x="385" y="189" width="100" height="7" rx="2"/>
      <rect x="385" y="203" width="70" height="7" rx="2"/>
      <rect x="385" y="217" width="95" height="7" rx="2"/>
    </g>
    <rect x="385" y="250" width="45" height="16" rx="8" fill="url(#brandGradient)" opacity="0.2"/>
    <text x="407.5" y="261" text-anchor="middle" font-size="7" font-weight="600" fill="#06B6D4" font-family="system-ui">News</text>

    <!-- Small page bottom left -->
    <rect x="30" y="320" width="100" height="130" rx="6" fill="url(#pageGradient)" stroke="#E2E8F0" stroke-width="0.5" opacity="0.4">
      <animate attributeName="y" values="320;315;320" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="335" width="70" height="10" rx="2" fill="url(#brandGradient)" opacity="0.5"/>
    <g font-size="8" fill="#64748B" opacity="0.4" font-family="system-ui">
      <rect x="40" y="355" width="60" height="6" rx="1"/>
      <rect x="40" y="365" width="50" height="6" rx="1"/>
    </rect>

    <!-- Small page bottom right -->
    <rect x="400" y="340" width="90" height="120" rx="6" fill="url(#pageGradient)" stroke="#E2E8F0" stroke-width="0.5" opacity="0.4">
      <animate attributeName="y" values="340;335;340" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="412" y="355" width="65" height="10" rx="2" fill="url(#brandGradient)" opacity="0.5"/>
    <g font-size="8" fill="#64748B" opacity="0.4" font-family="system-ui">
      <rect x="412" y="375" width="55" height="6" rx="1"/>
      <rect x="412" y="385" width="45" height="6" rx="1"/>
    </rect>
  </g>

  <!-- Floating AI sparkles/magic particles -->
  <g fill="url(#brandGradient)" filter="url(#softGlow)">
    <circle cx="90" cy="60" r="3" opacity="0.6">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="80" r="2.5" opacity="0.5">
      <animate attributeName="r" values="2.5;4;2.5" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="300" r="4" opacity="0.4">
      <animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="460" cy="320" r="3" opacity="0.5">
      <animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="270" cy="20" r="2" opacity="0.7">
      <animate attributeName="r" values="2;3.5;2" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="470" r="3.5" opacity="0.4">
      <animate attributeName="r" values="3.5;5;3.5" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Pen/writing tool icon -->
  <g transform="translate(430, 80)" opacity="0.3" filter="url(#softGlow)">
    <path d="M 0 20 L 10 10 L 25 25 L 15 35 Z" fill="url(#brandGradient)"/>
    <path d="M 10 10 L 15 15" stroke="url(#brandGradient)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 15 15 L 20 10" stroke="url(#brandGradient)" stroke-width="2" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;5,-5;0,0" dur="3s" repeatCount="indefinite" additive="sum"/>
    <animateTransform attributeName="transform" type="rotate" values="0;5;0;-5;0" dur="4s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- Connection lines -->
  <g stroke="url(#brandGradient)" stroke-width="1" stroke-dasharray="5,10" opacity="0.1" filter="url(#softGlow)">
    <path d="M 140 180 Q 170 120 200 80"/>
    <path d="M 330 180 Q 350 120 320 80"/>
    <path d="M 270 330 Q 270 280 270 220"/>
  </g>

  <!-- Nigerian flag subtle accent -->
  <g opacity="0.06">
    <rect x="10" y="10" width="6" height="6" fill="#008751" rx="1"/>
    <rect x="484" y="484" width="6" height="6" fill="#FFFFFF" rx="1" stroke="#008751" stroke-width="0.5"/>
  </g>

  <!-- Decorative brackets -->
  <g font-family="monospace" font-size="28" font-weight="bold" fill="url(#brandGradient)" opacity="0.15" filter="url(#softGlow)">
    <text x="20" y="100" text-anchor="middle">{</text>
    <text x="480" y="100" text-anchor="middle">}</text>
    <text x="20" y="420" text-anchor="middle">[</text>
    <text x="480" y="420" text-anchor="middle">]</text>
  </g>
</svg>