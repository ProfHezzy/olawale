<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="cardGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="cardGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:0.15" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.15"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="url(#brandGradient)" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="500" height="500" fill="url(#grid)"/>

  <!-- Floating project cards -->
  <g filter="url(#cardShadow)">
    <!-- Card 1 - Back -->
    <rect x="80" y="120" width="140" height="180" rx="12" fill="url(#cardGradient1)" stroke="url(#brandGradient)" stroke-width="1" opacity="0.6" filter="url(#softGlow)">
      <animate attributeName="y" values="120;110;120" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="92" y="132" width="116" height="8" rx="4" fill="url(#brandGradient)" opacity="0.5"/>
    <rect x="92" y="150" width="80" height="4" rx="2" fill="#64748B" opacity="0.4"/>
    <rect x="92" y="162" width="100" height="4" rx="2" fill="#64748B" opacity="0.3"/>
    <rect x="92" y="174" width="60" height="4" rx="2" fill="#64748B" opacity="0.2"/>
    <rect x="92" y="210" width="116" height="50" rx="8" fill="url(#brandGradient)" opacity="0.2"/>

    <!-- Card 2 - Center/Main -->
    <rect x="180" y="80" width="160" height="200" rx="16" fill="url(#cardGradient2)" stroke="url(#brandGradient)" stroke-width="2" filter="url(#softGlow)">
      <animate attributeName="y" values="80;75;80" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <!-- Featured badge -->
    <rect x="210" y="100" width="40" height="20" rx="10" fill="#F59E0B" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="230" y="115" text-anchor="middle" font-size="9" font-weight="bold" fill="white" font-family="system-ui">★</text>
    <!-- Card content -->
    <rect x="200" y="135" width="120" height="10" rx="5" fill="url(#brandGradient)" opacity="0.8"/>
    <rect x="200" y="155" width="100" height="6" rx="3" fill="#475569" opacity="0.5"/>
    <rect x="200" y="170" width="110" height="6" rx="3" fill="#475569" opacity="0.4"/>
    <rect x="200" y="185" width="80" height="6" rx="3" fill="#475569" opacity="0.3"/>
    <!-- Tech tags -->
    <g font-size="8" font-weight="600" font-family="system-ui">
      <rect x="200" y="210" width="35" height="16" rx="4" fill="url(#brandGradient)" opacity="0.3"/>
      <text x="217.5" y="221" text-anchor="middle" fill="#4F46E5">React</text>
      <rect x="240" y="210" width="40" height="16" rx="4" fill="url(#brandGradient)" opacity="0.3"/>
      <text x="260" y="221" text-anchor="middle" fill="#06B6D4">NestJS</text>
      <rect x="285" y="210" width="30" height="16" rx="4" fill="url(#brandGradient)" opacity="0.3"/>
      <text x="300" y="221" text-anchor="middle" fill="#F59E0B">AI</text>
    </g>
    <!-- Action buttons -->
    <rect x="200" y="245" width="55" height="28" rx="8" fill="url(#brandGradient)"/>
    <rect x="265" y="245" width="55" height="28" rx="8" fill="url(#brandGradient)" opacity="0.3" stroke="url(#brandGradient)" stroke-width="1"/>

    <!-- Card 3 - Front right -->
    <rect x="340" y="140" width="130" height="160" rx="12" fill="url(#cardGradient3)" stroke="url(#brandGradient)" stroke-width="1" opacity="0.7" filter="url(#softGlow)">
      <animate attributeName="y" values="140;130;140" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="352" y="152" width="106" height="8" rx="4" fill="url(#brandGradient)" opacity="0.5"/>
    <rect x="352" y="170" width="70" height="4" rx="2" fill="#64748B" opacity="0.4"/>
    <rect x="352" y="182" width="90" height="4" rx="2" fill="#64748B" opacity="0.3"/>
    <rect x="352" y="194" width="50" height="4" rx="2" fill="#64748B" opacity="0.2"/>
    <rect x="352" y="220" width="106" height="45" rx="8" fill="url(#brandGradient)" opacity="0.2"/>

    <!-- Card 4 - Bottom left -->
    <rect x="40" y="300" width="120" height="140" rx="10" fill="url(#cardGradient1)" stroke="url(#brandGradient)" stroke-width="1" opacity="0.5" filter="url(#softGlow)">
      <animate attributeName="y" values="300;295;300" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="52" y="312" width="96" height="6" rx="3" fill="url(#brandGradient)" opacity="0.5"/>
    <rect x="52" y="325" width="60" height="4" rx="2" fill="#64748B" opacity="0.3"/>
    <rect x="52" y="335" width="80" height="4" rx="2" fill="#64748B" opacity="0.2"/>

    <!-- Card 5 - Bottom right -->
    <rect x="360" y="320" width="110" height="130" rx="10" fill="url(#cardGradient2)" stroke="url(#brandGradient)" stroke-width="1" opacity="0.5" filter="url(#softGlow)">
      <animate attributeName="y" values="320;315;320" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="372" y="332" width="86" height="6" rx="3" fill="url(#brandGradient)" opacity="0.5"/>
    <rect x="372" y="345" width="50" height="4" rx="2" fill="#64748B" opacity="0.3"/>
    <rect x="372" y="355" width="70" height="4" rx="2" fill="#64748B" opacity="0.2"/>

    <!-- Card 6 - Far back center -->
    <rect x="200" y="330" width="100" height="120" rx="10" fill="url(#cardGradient3)" stroke="url(#brandGradient)" stroke-width="0.5" opacity="0.3" filter="url(#softGlow)">
      <animate attributeName="y" values="330;325;330" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Floating tech icons/particles -->
  <g font-family="system-ui" font-weight="bold" fill="url(#brandGradient)" opacity="0.4" filter="url(#softGlow)">
    <text x="30" y="80" font-size="20">&#60;/&#62;</text>
    <text x="460" y="60" font-size="16">{ }</text>
    <text x="20" y="420" font-size="18">[ ]</text>
    <text x="470" y="440" font-size="22">&#60;div&#62;</text>
    <text x="480" y="180" font-size="14">const</text>
    <text x="10" y="200" font-size="14">async</text>
  </g>

  <!-- Connection lines suggesting project relationships -->
  <g stroke="url(#brandGradient)" stroke-width="1" stroke-dasharray="6,6" opacity="0.15" filter="url(#softGlow)">
    <path d="M 260 280 Q 200 250 140 250"/>
    <path d="M 260 280 Q 320 250 380 250"/>
    <path d="M 260 280 Q 260 350 260 380"/>
    <path d="M 100 200 Q 150 250 200 280"/>
    <path d="M 420 220 Q 360 250 300 280"/>
  </g>

  <!-- Nigerian flag subtle accent -->
  <g opacity="0.08">
    <rect x="15" y="15" width="8" height="8" fill="#008751" rx="1"/>
    <rect x="477" y="477" width="8" height="8" fill="#FFFFFF" rx="1" stroke="#008751" stroke-width="0.5"/>
  </g>
</svg>