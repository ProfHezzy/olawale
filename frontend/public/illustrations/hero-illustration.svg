<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brandGradientReverse" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:0" />
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background atmosphere -->
  <rect width="600" height="600" fill="url(#brandGradient)" opacity="0.03"/>

  <!-- Large ambient glow -->
  <circle cx="300" cy="200" r="250" fill="url(#glowGradient)" filter="url(#softGlow)"/>

  <!-- Floating geometric shapes representing code/tech -->
  <g filter="url(#softGlow)" opacity="0.6">
    <!-- Central cube/terminal -->
    <g transform="translate(300, 300)">
      <!-- Isometric cube -->
      <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30"
        fill="none" stroke="url(#brandGradient)" stroke-width="2.5" stroke-linejoin="round"/>
      <polygon points="0,-60 52,-30 0,0 -52,-30"
        fill="url(#brandGradient)" opacity="0.15"/>
      <polygon points="52,-30 52,30 0,60 0,0"
        fill="url(#brandGradientReverse)" opacity="0.1"/>
      <polygon points="0,-60 -52,-30 0,0 -52,30"
        fill="url(#brandGradient)" opacity="0.2"/>

      <!-- Inner code lines -->
      <g stroke="url(#brandGradient)" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
        <line x1="-30" y1="-20" x2="30" y2="-20"/>
        <line x1="-30" y1="0" x2="15" y2="0"/>
        <line x1="-30" y1="20" x2="25" y2="20"/>
        <!-- Cursor -->
        <line x1="35" y1="-28" x2="35" y2="-12" stroke="#F59E0B" stroke-width="2">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </line>
      </g>
    </g>

    <!-- Floating particles/data points -->
    <g fill="url(#brandGradient)">
      <circle cx="120" cy="150" r="4">
        <animate attributeName="cy" values="150;130;150" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="480" cy="180" r="3">
        <animate attributeName="cy" values="180;160;180" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" cy="450" r="5">
        <animate attributeName="cy" values="450;430;450" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="500" cy="420" r="3.5">
        <animate attributeName="cy" values="420;400;420" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" cy="500" r="2.5">
        <animate attributeName="cy" values="500;485;500" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="420" cy="520" r="4">
        <animate attributeName="cy" values="520;500;520" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Orbiting rings -->
    <g stroke="url(#brandGradient)" stroke-width="1.5" fill="none" stroke-dasharray="8,12">
      <circle cx="300" cy="300" r="120" opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="0 300 300" to="360 300 300" dur="20s" repeatCount="indefinite"/>
      </circle>
      <circle cx="300" cy="300" r="160" opacity="0.2" stroke-dasharray="12,8">
        <animateTransform attributeName="transform" type="rotate" from="360 300 300" to="0 300 300" dur="25s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Floating brackets/braces representing code -->
    <g font-family="monospace" font-size="24" font-weight="bold" fill="url(#brandGradient)" opacity="0.5">
      <text x="80" y="280" text-anchor="middle">{</text>
      <text x="520" y="280" text-anchor="middle">}</text>
      <text x="80" y="360" text-anchor="middle">[</text>
      <text x="520" y="360" text-anchor="middle">]</text>
      <text x="150" y="520" text-anchor="middle"></></text>
      <text x="450" y="520" text-anchor="middle">{ }</text>
    </g>

    <!-- Connection lines between elements -->
    <g stroke="url(#brandGradient)" stroke-width="1" stroke-dasharray="4,8" opacity="0.2">
      <line x1="150" y1="150" x2="300" y2="200"/>
      <line x1="450" y1="180" x2="300" y2="200"/>
      <line x1="120" y1="450" x2="200" y2="350"/>
      <line x1="480" y1="420" x2="400" y2="350"/>
    </g>
  </g>

  <!-- Nigerian flag color accent - subtle -->
  <g opacity="0.15">
    <rect x="50" y="50" width="12" height="12" fill="#008751" rx="2">
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="538" y="538" width="12" height="12" fill="#FFFFFF" rx="2" stroke="#008751" stroke-width="1">
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="4s" repeatCount="indefinite" begin="2s"/>
    </rect>
  </g>

  <!-- Signature accent line -->
  <path d="M 100 550 Q 300 480 500 550" stroke="url(#brandGradient)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.4">
    <animate attributeName="stroke-dashoffset" values="0;-100;0" dur="8s" repeatCount="indefinite"/>
  </path>
</svg>